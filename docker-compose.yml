services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  backend:
    build: ./backend
    container_name: solidara-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://root:${MONGO_PASSWORD}@mongodb:27017/solidara?authSource=admin
      PORT: 3000
      API_KEY: ${API_KEY:-}
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.solidara-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.solidara-api.entrypoints=websecure"
      - "traefik.http.routers.solidara-api.tls.certresolver=le"
      - "traefik.http.services.solidara-api.loadbalancer.server.port=3000"

volumes:
  mongo-data:

networks:
  traefik:
    external: true
    name: traefik_default

